version: 2

models:
  - name: stg_crm__users
    columns:
      - name: rep_id
        tests: [unique, not_null]
  - name: stg_crm__accounts
    columns:
      - name: account_id
        tests: [unique, not_null]
      - name: owner_id
        tests:
          - relationships:
              arguments: {to: ref('stg_crm__users'), field: rep_id}
  - name: stg_crm__opportunities
    columns:
      - name: opportunity_id
        tests: [unique, not_null]
      - name: owner_id
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_crm__users'), field: rep_id}
      - name: account_id
        tests:
          - relationships:
              arguments: {to: ref('stg_crm__accounts'), field: account_id}
      - name: opportunity_type
        tests:
          - accepted_values:
              arguments: {values: ['New Business', 'Expansion', 'Renewal']}
      - name: stage_name
        tests:
          - accepted_values:
              arguments:
                values: ['1-Discovery', '2-Qualification', '3-Solution', '4-Proposal', '5-Negotiation',
                         'Closed Won', 'Closed Lost']
  - name: stg_crm__opportunity_history
    tests:
      - unique:
          column_name: "opportunity_id || '|' || cast(changed_at as varchar)"
    columns:
      - name: history_id
        tests: [unique, not_null]
      - name: opportunity_id
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_crm__opportunities'), field: opportunity_id}
      - name: forecast_category
        tests:
          - accepted_values:
              arguments: {values: ['Pipeline', 'Best Case', 'Commit', 'Closed', 'Omitted']}
  - name: stg_crm__contracts
    columns:
      - name: contract_id
        tests: [unique, not_null]
      - name: opportunity_id
        tests:
          - unique
          - relationships:
              arguments: {to: ref('stg_crm__opportunities'), field: opportunity_id}
      - name: renewed_contract_id
        tests:
          - unique
          - relationships:
              arguments: {to: ref('stg_crm__contracts'), field: contract_id}
  - name: stg_crm__quotas
    tests:
      - unique:
          column_name: "rep_id || '|' || cast(quarter_start as varchar)"
